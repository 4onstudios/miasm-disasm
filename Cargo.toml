[package]
edition = "2021"
rust-version = "1.85"
name = "miasm-disasm"
version = "0.1.0"
build = false
include = [
    "Dockerfile",
    ".dockerignore",
    "assets/logo.svg",
    "src/*.rs",
    "python/*.py",
    "python/requirements.txt",
    "python/mcp-requirements.txt",
    "tests/*.rs",
    "tests/*.py",
    "examples/*",
    "scripts/*.py",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "TESTING.md",
    "NOTICE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust CLI and typed library for static disassembly through Miasm"
readme = "README.md"
keywords = [
    "disassembler",
    "miasm",
    "reverse-engineering",
    "binary",
    "pe",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "GPL-2.0-only"

[lib]
name = "miasm_disasm"
path = "src/lib.rs"

[[bin]]
name = "miasm-disasm"
path = "src/main.rs"

[[example]]
name = "inspect"
path = "examples/inspect.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies.clap]
version = "=4.5.31"
features = [
    "derive",
    "env",
]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[profile.release]
lto = "off"
strip = true
