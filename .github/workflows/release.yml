name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} must match Cargo version v{version}")
          PY

  build:
    needs: [checks, version]
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: miasm-disasm
          - os: macos-14
            target: aarch64-apple-darwin
            binary: miasm-disasm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: miasm-disasm.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package binary and runtime requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          archive="miasm-disasm-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$archive/python" "dist/$archive/assets"
          cp "target/$TARGET/release/$BINARY" "dist/$archive/"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/$archive/"
          cp assets/logo.svg "dist/$archive/assets/"
          cp python/requirements.txt "dist/$archive/python/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate packaged fixtures
        run: python scripts/make_fixtures.py
      - name: Build verified Cargo source archive
        run: cargo package --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Collect source archive and checksums
        run: |
          cp target/package/*.crate release-assets/
          cd release-assets
          sha256sum *.tar.gz *.crate > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" release-assets/*